version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: placement_iq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: placement_iq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_iq_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/placement_iq
      JWT_SECRET_KEY: placement_iq_super_secret_jwt_key_2026_secure
      JWT_REFRESH_SECRET_KEY: placement_iq_super_refresh_key_2026_secure
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_iq_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
